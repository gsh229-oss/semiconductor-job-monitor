name: Daily Job Monitor Sync

# 참고: 워크넷(work24.go.kr)이 간헐적으로 응답 지연/실패를 보여서
# (관측된 성공률 약 65~70%) collector.py에 재시도 로직을 추가했습니다.
# 그래도 가끔 실패할 수 있는데, 공채속보 특성상 하루 놓쳐도 마감 전까지는
# 다음 실행에서 다시 잡히므로 큰 문제는 없습니다.
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = KST 09:00
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 채용공고 수집 및 Notion 동기화
        env:
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python notion_sync.py
